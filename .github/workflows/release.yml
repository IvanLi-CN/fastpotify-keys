name: Draft release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Select Swift 6 toolchain
        run: scripts/ci/select-swift6.sh
      - name: Ensure tag matches VERSION
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          expected="v$(tr -d '[:space:]' < VERSION)"
          test "$TAG_NAME" = "$expected"
      - name: Run Swift tests
        run: scripts/macos/test.sh
      - name: Build universal Ad Hoc app
        run: scripts/macos/package.sh --output-dir "$RUNNER_TEMP/fastpotify-keys-dist"
      - name: Verify release artifact
        run: |
          scripts/macos/verify-release.sh \
            --app "$RUNNER_TEMP/fastpotify-keys-dist/Fastpotify Keys.app" \
            --dmg "$RUNNER_TEMP/fastpotify-keys-dist/FastpotifyKeys-$(tr -d '[:space:]' < VERSION)-universal.dmg" \
            --checksums "$RUNNER_TEMP/fastpotify-keys-dist/SHA256SUMS"
      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          notes="$RUNNER_TEMP/fastpotify-keys-release-notes.md"
          printf '%s\n' \
            'Fastpotify Keys is distributed as an unsigned-by-Developer-ID Ad Hoc macOS app.' \
            '' \
            'Keep this release in Draft until the macOS 13 arm64 and x86_64 physical-key checklist is complete.' \
            > "$notes"
          gh release create "$TAG_NAME" \
            --draft \
            --title "Fastpotify Keys $TAG_NAME" \
            --notes-file "$notes" \
            "$RUNNER_TEMP/fastpotify-keys-dist/FastpotifyKeys-$(tr -d '[:space:]' < VERSION)-universal.dmg" \
            "$RUNNER_TEMP/fastpotify-keys-dist/SHA256SUMS"
